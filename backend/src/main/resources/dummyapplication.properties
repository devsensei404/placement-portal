spring.application.name=Job_Portal

admin.secret.key=${ADMIN_SECRET_KEY}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

gemini.api.key=${GEMINI_API_KEY}

spring.mail.password=${MAIL_APP_PASSWORD}

otp.mail.host=smtp.gmail.com
otp.mail.port=587
otp.mail.username=${OTP_MAIL_ADDRESS}
otp.mail.password=${OTP_MAIL_APP_PASSWORD}
otp.mail.properties.mail.smtp.auth=true
otp.mail.properties.mail.smtp.starttls.enable=true

notifications.mail.host=smtp.gmail.com
notifications.mail.port=587
notifications.mail.username=${NOTIFICATIONS_MAIL_ADDRESS}
notifications.mail.password=${NOTIFICATIONS_MAIL_APP_PASSWORD}
notifications.mail.properties.mail.smtp.auth=true
notifications.mail.properties.mail.smtp.starttls.enable=true


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true


